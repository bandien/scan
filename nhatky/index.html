<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nhật ký công việc | BanDienScan Zalo Style</title>
  <meta name="description" content="Quản lý công việc & Checklist vận hành - Zalo Layout">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0084FF">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230084FF'/%3E%3Ctext x='50' y='70' font-family='Arial,Helvetica,sans-serif' font-size='52' font-weight='900' fill='white' text-anchor='middle'%3EBD%3C/text%3E%3C/svg%3E">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --zalo-blue: #0084FF;
      --zalo-bg: #FFFFFF;
      --zalo-text: #000000;
      --zalo-subtext: #72767d;
      --zalo-badge: #E51C23;
      --zalo-line: #F0F0F0;
    }
    body {
      min-height: 100dvh;
      background: #e9ebe8;
      color: var(--zalo-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
    }
    .app-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--zalo-bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 1. Header (Thanh tìm kiếm & Công cụ) - Màu Xanh Dương */
    .zalo-header {
      background: var(--zalo-blue);
      color: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .zalo-search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .zalo-search-wrap i {
      position: absolute;
      left: 12px;
      color: #FFFFFF;
      font-size: 1.1rem;
    }
    .zalo-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 20px;
      padding: 6px 12px 6px 36px;
      color: #FFFFFF;
      font-size: 0.92rem;
      outline: none;
    }
    .zalo-search-input::placeholder { color: rgba(255, 255, 255, 0.85); }
    .zalo-header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #FFFFFF;
      font-size: 1.3rem;
    }
    .zalo-header-actions i { cursor: pointer; }

    /* 2. Sub-header (Tab phân loại) - Background Trắng - 3 Tab */
    .zalo-subheader {
      background: #FFFFFF;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--zalo-line);
    }
    .zalo-subtab {
      padding: 12px 0;
      margin-right: 20px;
      font-size: 0.92rem;
      color: var(--zalo-subtext);
      cursor: pointer;
      position: relative;
      font-weight: 500;
    }
    .zalo-subtab.active {
      color: #000000;
      font-weight: 700;
      border-bottom: 2px solid #000000;
    }

    /* 3. Body (Danh sách cuộc trò chuyện - ListView) */
    .zalo-listview {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }
    .zalo-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--zalo-line);
      cursor: pointer;
      gap: 12px;
    }
    .zalo-item:active { background-color: #f7f7f7; }
    /* Avatar vuông bo góc, thể hiện ảnh đính kèm hoặc avatar người giao việc */
    .zalo-avatar-square {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0084FF, #0052cc);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
      overflow: hidden;
      object-fit: cover;
    }
    .zalo-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .zalo-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zalo-title {
      font-size: 0.98rem;
      color: #000000;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .zalo-subtitle {
      font-size: 0.84rem;
      color: var(--zalo-subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .zalo-status-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-height: 48px;
      flex-shrink: 0;
    }
    .zalo-time {
      font-size: 0.75rem;
      color: var(--zalo-subtext);
    }
    .zalo-status-icon-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      background: #eef2ff;
      color: #4f46e5;
    }

    /* 4. Bottom Navigation Bar (Thanh điều hướng dưới) */
    .zalo-bottomnav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-top: 1px solid var(--zalo-line);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0 8px;
      z-index: 100;
    }
    .zalo-nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--zalo-subtext);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      position: relative;
    }
    .zalo-nav-tab.active {
      color: var(--zalo-blue);
      font-weight: 600;
    }
    .zalo-nav-icon-wrap {
      position: relative;
      font-size: 1.4rem;
      line-height: 1;
      margin-bottom: 2px;
    }
    .zalo-nav-badge {
      position: absolute;
      top: -4px;
      right: -8px;
      background: var(--zalo-badge);
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 800;
      border-radius: 10px;
      padding: 1px 5px;
    }

    /* 5. Chat Modal UI */
    .chat-modal-body {
      background: #e2e8f0; /* Zalo chat background */
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble-wrap {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .chat-bubble-wrap.me {
      flex-direction: row-reverse;
    }
    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0084FF, #0052cc);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .chat-bubble-content {
      background: #FFFFFF;
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 80%;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .chat-bubble-wrap.me .chat-bubble-content {
      background: #eef2ff; /* slight blue for 'me' */
    }
    .chat-bubble-title {
      font-weight: 600;
      color: #000000;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .chat-bubble-text {
      font-size: 0.95rem;
      color: #333333;
      word-wrap: break-word;
    }
    .chat-bubble-quote {
      border-left: 3px solid #0084FF;
      padding-left: 8px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #666666;
    }
    .chat-bubble-time {
      font-size: 0.7rem;
      color: #999999;
      margin-top: 4px;
      text-align: right;
    }
    .chat-input-bar {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #FFFFFF;
      border-top: 1px solid var(--zalo-line);
      gap: 12px;
    }
    .chat-input-bar i {
      font-size: 1.4rem;
      color: #72767d;
      cursor: pointer;
    }
    .chat-input-box {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      padding: 6px 0;
    }
    .chat-input-box::placeholder {
      color: #b0b3b8;
    }
    .chat-action-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. Header (Thanh tìm kiếm & QR / Plus Icons) -->
    <header class="zalo-header">
      <div class="zalo-search-wrap">
        <i class="bi bi-search"></i>
        <input type="search" class="zalo-search-input" placeholder="Search">
      </div>
      <div class="zalo-header-actions">
        <i class="bi bi-qr-code-scan" title="Quét QR"></i>
        <i class="bi bi-plus-lg" title="Tạo mới / Mở rộng" onclick="openQuickTaskModal()"></i>
      </div>
    </header>

    <!-- 2. Sub-header (Tab phân loại) - 3 Tab -->
    <div class="zalo-subheader">
      <div class="zalo-subtab active" id="tabWork" onclick="switchSubTab('work')">Việc cần làm</div>
      <div class="zalo-subtab" id="tabPlan" onclick="switchSubTab('plan')">Kế hoạch</div>
      <div class="zalo-subtab" id="tabChecklist" onclick="switchSubTab('checklist')">Checklist</div>
    </div>

    <!-- 3. Body (ListView danh sách việc Zalo style) -->
    <main class="zalo-listview" id="zaloListView">
      <!-- Direct JS Render -->
    </main>

    <!-- 4. Bottom Navigation Bar -->
    <nav class="zalo-bottomnav">
      <div class="zalo-nav-tab active">
        <div class="zalo-nav-icon-wrap">
          <i class="bi bi-chat-dots-fill"></i>
          <span class="zalo-nav-badge">5+</span>
        </div>
        <span>Công việc</span>
      </div>
      <div class="zalo-nav-tab">
        <div class="zalo-nav-icon-wrap"><i class="bi bi-person"></i></div>
        <span>Contacts</span>
      </div>
      <div class="zalo-nav-tab">
        <div class="zalo-nav-icon-wrap">
          <i class="bi bi-grid"></i>
          <span class="zalo-nav-badge" style="width: 8px; height: 8px; padding: 0; top: 0; right: 0;"></span>
        </div>
        <span>Discovery</span>
      </div>
      <div class="zalo-nav-tab">
        <div class="zalo-nav-icon-wrap"><i class="bi bi-person-circle"></i></div>
        <span>Me</span>
      </div>
    </nav>
  </div>

  <!-- Modal Ghi Nhanh Việc Nhỏ / Ghi Hộ -->
  <div class="modal fade" id="quickTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-primary"><i class="bi bi-plus-circle-fill me-2"></i>Tạo Việc Mới / Ghi Hộ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="quickTaskForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Tên công việc / Sự cố *</label>
              <input type="text" id="qtTask" class="form-control" placeholder="Tên công việc..." required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Vị trí / Khu vực</label>
              <input type="text" id="qtArea" class="form-control" placeholder="Ví dụ: Tầng hầm B1...">
            </div>
            <div class="mb-3 p-2 bg-light rounded-3 border" id="proxyLoggingSection">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="qtIsProxy">
                <label class="form-check-input-label small fw-bold text-primary" for="qtIsProxy">
                  Tổ trưởng / Quản lý ghi hộ cho nhân viên
                </label>
              </div>
              <div class="mt-2 d-none" id="qtProxyWorkerWrap">
                <select id="qtWorker" class="form-select form-select-sm">
                  <option value="Thắng NQ">Thắng NQ</option>
                  <option value="Hậu DV">Hậu DV</option>
                  <option value="Hoàng HV">Hoàng HV</option>
                  <option value="Phong ND">Phong ND</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Lưu & Tạo Việc</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Chi Tiết Công Việc (Zalo Chat UI) -->
  <div class="modal fade" id="taskDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 rounded-4 overflow-hidden">
        <!-- Header: Xanh dương giống chat -->
        <div class="modal-header rounded-0 text-white" style="background: var(--zalo-blue); padding: 10px 14px;">
          <div class="d-flex align-items-center gap-3 w-100">
            <i class="bi bi-chevron-left fs-4" data-bs-dismiss="modal" style="cursor: pointer;"></i>
            <div class="flex-grow-1 overflow-hidden">
              <div class="fw-bold text-truncate" id="chatModalTitle">Chi tiết công việc</div>
              <div class="small text-white-50" id="chatModalSubtitle" style="font-size: 0.75rem;">Đang hoạt động</div>
            </div>
            <i class="bi bi-telephone fs-5"></i>
            <i class="bi bi-camera-video fs-5"></i>
            <i class="bi bi-list fs-4 ms-2"></i>
          </div>
        </div>
        
        <!-- Body: Nền xám, danh sách bubble -->
        <div class="modal-body chat-modal-body" id="taskDetailBody">
          <!-- Render dynamically -->
        </div>
        
        <!-- Footer: Thanh nhập liệu -->
        <div class="modal-footer p-0 border-0 d-block">
          <!-- Suggestion pills for quick actions -->
          <div class="px-3 py-2 bg-light border-top d-flex gap-2 overflow-x-auto" id="chatQuickActions">
            <span class="badge bg-white text-dark border rounded-pill px-3 py-2 text-nowrap shadow-sm" style="cursor:pointer" id="btnMarkDone">✅ Đánh dấu hoàn thành</span>
            <span class="badge bg-white text-dark border rounded-pill px-3 py-2 text-nowrap shadow-sm" style="cursor:pointer" onclick="document.getElementById('chatInputMsg').value='Tôi đang tới xử lý...'; document.getElementById('chatInputMsg').dispatchEvent(new Event('input'));">📍 Đã tới vị trí</span>
          </div>
          
          <div class="chat-input-bar">
            <i class="bi bi-emoji-smile"></i>
            <input type="text" class="chat-input-box" id="chatInputMsg" placeholder="Message">
            <div class="chat-action-icons" id="chatActionIcons">
              <i class="bi bi-three-dots"></i>
              <i class="bi bi-mic"></i>
              <i class="bi bi-image"></i>
            </div>
            <i class="bi bi-send-fill text-primary d-none fs-4" id="chatBtnSend"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared CSS cho Toast notification -->
  <link href="../css/shared.css" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script src="../js/sso.js"></script>
  <script src="../js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let allPlans = [];
    let staffList = [];
    let staffDirectory = [];
    let currentOpenPlanId = null;
    let currentTab = 'work';
    let quickModalInstance, detailModalInstance;

    document.addEventListener("DOMContentLoaded", () => {
      quickModalInstance = new bootstrap.Modal(document.getElementById("quickTaskModal"));
      detailModalInstance = new bootstrap.Modal(document.getElementById("taskDetailModal"));
      
      const user = BD_SSO.getUser();
      if (user) {
            workerSelect.add(opt, workerSelect[0]);
          }
          workerSelect.value = user.name;
        }
      } else {
        BD_SSO.requireLogin();
      }
      
      loadPlans();

      document.getElementById("qtIsProxy").addEventListener("change", (e) => {
        document.getElementById("qtProxyWorkerWrap").classList.toggle("d-none", !e.target.checked);
      });

      document.getElementById("quickTaskForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const task = document.getElementById("qtTask").value;
        const area = document.getElementById("qtArea").value;
        const isProxy = document.getElementById("qtIsProxy").checked;
        
        let currentUserInfo = BD_SSO.getUser();
        let currentUserName = currentUserInfo ? (currentUserInfo.name || currentUserInfo.username) : "Unknown";
        
        const sender = isProxy ? document.getElementById("qtWorker").value : currentUserName;
        const updatedBy = currentUserName;

        const payload = {
          date: new Date().toISOString().split('T')[0],
          task: task,
          area: area,
          assignee: sender,
          updatedBy: updatedBy,
          type: "Phát sinh",
          status: "Đang làm",
          priority: "Trung bình",
          source: "NhatKy_GhiNhanh"
        };
        
        try {
          const btn = e.target.querySelector('button[type="submit"]');
          const oldText = btn.innerHTML;
          btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang lưu...';
          btn.disabled = true;
          
          await window.bdsApiPost('savePlan', payload);
          
          btn.innerHTML = oldText;
          btn.disabled = false;
          
          quickModalInstance.hide();
          document.getElementById("quickTaskForm").reset();
          if (window.bdsShowToast) window.bdsShowToast("Đã tạo công việc thành công!", "success");
          loadPlans(); 
        } catch(err) {
          alert("Lỗi khi lưu: " + err.message);
          const btn = e.target.querySelector('button[type="submit"]');
          btn.innerHTML = 'Lưu & Tạo Việc';
          btn.disabled = false;
        }
      });
    });

    async function loadPlans() {
      const container = document.getElementById("zaloListView");
      container.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted small">Đang tải công việc từ Server...</p></div>';
      
      try {
        let user = BD_SSO.getUser();
        let username = user ? (user.username || user.name) : "";
        const res = await window.bdsApiFetch('getPlans', { user: username });
        if (res.status === 'success' && res.plans) {
          allPlans = res.plans;
          // Sort by date/time desc roughly
          allPlans.sort((a,b) => {
            let d1 = new Date(a.date + ' ' + (a.time||'00:00')).getTime();
            let d2 = new Date(b.date + ' ' + (b.time||'00:00')).getTime();
            return isNaN(d1) || isNaN(d2) ? 0 : d2 - d1;
          });
          renderZaloListView();
        } else {
          container.innerHTML = '<div class="text-center py-4 text-danger">Không tải được dữ liệu</div>';
        }
      } catch (err) {
        container.innerHTML = '<div class="text-center py-4 text-danger">Lỗi kết nối: ' + err.message + '</div>';
      }
    }

    function switchSubTab(type) {
      currentTab = type;
      document.getElementById("tabWork").classList.toggle("active", type === 'work');
      document.getElementById("tabPlan").classList.toggle("active", type === 'plan');
      document.getElementById("tabChecklist").classList.toggle("active", type === 'checklist');
      renderZaloListView();
    }

    function renderZaloListView() {
      const container = document.getElementById("zaloListView");
      
      const filtered = allPlans.filter(p => {
        const isChecklist = p.type === 'Checklist' || p.source === 'Checklist System' || (p.task && p.task.includes('SỰ CỐ CHECKLIST'));
        if (currentTab === 'work') {
          return p.status !== 'Hoàn thành' && p.status !== 'Đã hủy' && !isChecklist;
        } else if (currentTab === 'plan') {
          return p.type === 'Kế hoạch';
        } else if (currentTab === 'checklist') {
          return isChecklist;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted"><i class="bi bi-inbox fs-1" style="color: #ccc;"></i><p class="mt-2">Không có công việc nào</p></div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const title = item.task || 'Không có tên';
        const sender = item.assignee || item.updatedBy || 'System';
        const avatarChar = sender.charAt(0).toUpperCase();
        
        let note = item.status;
        if(item.area) note += ' - ' + item.area;
        if(item.asset) note += ' (' + item.asset + ')';
        
        let timeStr = item.date;
        if(item.time) timeStr += ' ' + item.time;
        
        let badge = "";
        let badgeStyle = "background: #eef2ff; color: #4f46e5;";
        if(item.planQty) {
          badge = (item.doneQty || 0) + '/' + item.planQty;
          if (item.doneQty >= item.planQty) badgeStyle = "background: #d1fae5; color: #059669;";
        } else {
          badge = item.status === 'Hoàn thành' ? 'OK' : item.status;
          if (item.status === 'Hoàn thành') badgeStyle = "background: #d1fae5; color: #059669;";
          else if (item.status === 'Khẩn cấp' || (item.priority && item.priority.includes('Khẩn'))) badgeStyle = "background: #fee2e2; color: #e51c23;";
        }

        return `
        <div class="zalo-item" onclick="openTaskDetail('${item.id}')">
          <div class="zalo-avatar-square">${avatarChar}</div>
          <div class="zalo-content">
            <div class="zalo-title">${title}</div>
            <div class="zalo-subtitle">${sender}: ${note}</div>
          </div>
          <div class="zalo-status-col">
            <div class="zalo-time">${timeStr}</div>
            <div class="zalo-status-icon-tag" style="${badgeStyle}">${badge}</div>
          </div>
        </div>
        `;
      }).join("");
    }

    function openQuickTaskModal() { quickModalInstance.show(); }
    
    function openTaskDetail(id) {
      currentOpenPlanId = id;
      const plan = allPlans.find(p => p.id === id);
      if(!plan) return;
      
      const user = BD_SSO.getUser();
      const currentUserName = user ? (user.name || user.username) : "Tài khoản của bạn";
      
      // Update Header
      document.getElementById("chatModalTitle").textContent = plan.task;
      document.getElementById("chatModalSubtitle").textContent = "Người phụ trách: " + (plan.assignee || plan.updatedBy || 'Chưa gán');

      // Setup Input Bar interaction
      const inputMsg = document.getElementById("chatInputMsg");
      const actionIcons = document.getElementById("chatActionIcons");
      const btnSend = document.getElementById("chatBtnSend");
      
      inputMsg.value = "";
      actionIcons.classList.remove("d-none");
      btnSend.classList.add("d-none");

      inputMsg.addEventListener("input", function() {
        if(this.value.trim().length > 0) {
          actionIcons.classList.add("d-none");
          btnSend.classList.remove("d-none");
        } else {
          actionIcons.classList.remove("d-none");
          btnSend.classList.add("d-none");
        }
      });
      
      const body = document.getElementById("taskDetailBody");
      
      const sender = plan.assignee || plan.updatedBy || 'System';
      const senderAvatar = sender.charAt(0).toUpperCase();
      const isMe = sender === currentUserName;
      
      let html = "";
      
      // Bubble 1: Initial task info
      let infoText = `Mã: ${plan.id}`;
      if(plan.area) infoText += `<br>Vị trí: ${plan.area}`;
      if(plan.asset) infoText += `<br>Thiết bị: ${plan.asset}`;
      infoText += `<br>Trạng thái: <b>${plan.status}</b>`;
      
      html += `
        <div class="chat-bubble-wrap ${isMe ? 'me' : ''}">
          <div class="chat-avatar">${senderAvatar}</div>
          <div class="chat-bubble-content">
            <div class="chat-bubble-title">${sender}</div>
            <div class="chat-bubble-quote">Yêu cầu công việc / Sự cố mới phát sinh.</div>
            <div class="chat-bubble-text">${infoText}</div>
            <div class="chat-bubble-time">${plan.date} ${plan.time || ''}</div>
          </div>
        </div>
      `;
      
      // Bubble 2: Source Text or Notes if any
      if(plan.sourceText) {
        html += `
          <div class="chat-bubble-wrap ${isMe ? 'me' : ''}">
            <div class="chat-avatar">${senderAvatar}</div>
            <div class="chat-bubble-content">
              <div class="chat-bubble-text">${plan.sourceText}</div>
              <div class="chat-bubble-time">${plan.date} ${plan.time || ''}</div>
            </div>
          </div>
        `;
      }
      
      html += renderPhasesAndSteps(plan);
      
      body.innerHTML = html;
      
      const btnDone = document.getElementById("btnMarkDone");
      const quickActions = document.getElementById("chatQuickActions");
      if (plan.status === 'Hoàn thành') {
        quickActions.classList.add('d-none');
      } else {
        quickActions.classList.remove('d-none');
        btnDone.onclick = async () => {
          try {
            btnDone.innerHTML = '🔄 Đang cập nhật...';
            btnDone.disabled = true;
            
            await window.bdsApiPost('savePlan', {
              id: plan.id,
              status: "Hoàn thành",
              updatedBy: currentUserName,
              date: plan.date,
              task: plan.task
            });
            
            detailModalInstance.hide();
            if (window.bdsShowToast) window.bdsShowToast("Đã cập nhật trạng thái Hoàn thành!", "success");
            loadPlans();
          } catch(e) {
            alert("Lỗi cập nhật: " + e.message);
            btnDone.innerHTML = '✅ Đánh dấu hoàn thành';
            btnDone.disabled = false;
          }
        };
      }
      
      // Send chat
      btnSend.onclick = async () => {
        const msg = inputMsg.value.trim();
        if(!msg) return;
        
        // Append visual bubble directly
        const myAvatar = currentUserName.charAt(0).toUpperCase();
        const nowTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        body.insertAdjacentHTML('beforeend', `
          <div class="chat-bubble-wrap me">
            <div class="chat-avatar">${myAvatar}</div>
            <div class="chat-bubble-content">
              <div class="chat-bubble-text">${msg}</div>
              <div class="chat-bubble-time">${nowTime}</div>
            </div>
          </div>
        `);
        
        // Auto scroll
        body.scrollTop = body.scrollHeight;
        
        inputMsg.value = "";
        inputMsg.dispatchEvent(new Event('input')); // reset icons
        
        // Save to backend (Update sourceText or just show success)
        const newSourceText = (plan.sourceText ? plan.sourceText + "\n---\n" : "") + `[${nowTime}] ${currentUserName}: ${msg}`;
        try {
          await window.bdsApiPost('savePlan', {
            id: plan.id,
            sourceText: newSourceText,
            updatedBy: currentUserName,
            date: plan.date,
            task: plan.task
          });
          // Update local data
          plan.sourceText = newSourceText;
        } catch(e) {
          console.error("Save chat err:", e);
        }
      };
      
      detailModalInstance.show();
      // Scroll to bottom after show
      setTimeout(() => { body.scrollTop = body.scrollHeight; }, 300);
    }

    // ===== Task 2: Danh bạ (staffDirectory) Helpers =====
    async function loadStaff() {
      staffList = JSON.parse(localStorage.getItem("bandien_nhatky_staff_v2") || "[]");
      staffDirectory = JSON.parse(localStorage.getItem("bandien_nhatky_staff_directory_v1") || "[]");

      if (!staffDirectory.length) {
        try {
          const res = await fetch("../danhba_chuan_hoa.json", { cache: "no-cache" });
          if (res.ok) {
            const list = await res.json();
            staffDirectory = list.map(person => ({
              username: String(person.id || person.empId || "").trim(),
              name: String(person.fullName || "").trim(),
              shortName: String(person.commonName || "").trim(),
              phone: String(person.phone || "").trim(),
              dept: String(person.dept || person.toNhom || "").trim(),
              position: String(person.chucDanh || "").trim(),
              labels: String(person.toNhom || person.dept || "Public").trim()
            })).filter(p => p.name);
            staffList = staffDirectory.map(p => p.name).filter(Boolean).sort();
          }
        } catch (_) {}
      }

      try {
        const userStr = localStorage.getItem("currentUser");
        const curUser = userStr ? JSON.parse(userStr) : {};
        if (typeof bdsApiFetch !== 'undefined') {
          const data = await bdsApiFetch('getStaff', { role: curUser.role || '', team: curUser.teams || curUser.dept || '' }, { timeout: 10000, retries: 2 });
          if (data && data.status === "success" && Array.isArray(data.staff)) {
            staffDirectory = data.staff.map(person => ({
              username: String(person.username || person.id || "").trim(),
              name: String(person.fullName || person.name || person.username || "").trim(),
              shortName: String(person.shortName || person.commonName || person.short_name || "").trim(),
              phone: String(person.phone || "").trim(),
              dept: String(person.dept || "").trim(),
              position: String(person.position || "").trim(),
              labels: String(person.labels || person.dept || "Public").trim()
            })).filter(person => person.name || person.username);
            staffList = staffDirectory.map(person => person.name || person.username).filter(Boolean).sort();
            localStorage.setItem("bandien_nhatky_staff_v2", JSON.stringify(staffList));
            localStorage.setItem("bandien_nhatky_staff_directory_v1", JSON.stringify(staffDirectory));
            
            if (detailModalInstance && detailModalInstance._isShown && currentOpenPlanId) {
               openTaskDetail(currentOpenPlanId);
            }
          }
        }
      } catch (error) {
        console.error("loadStaff error", error);
      }
    }

    function getShortName(fullName) {
      if (!fullName) return "";
      const raw = String(fullName).trim();
      if (!raw) return "";

      const person = staffDirectory.find(p =>
        (p.name && p.name.toLowerCase() === raw.toLowerCase()) ||
        (p.username && p.username.toLowerCase() === raw.toLowerCase()) ||
        (p.shortName && p.shortName.toLowerCase() === raw.toLowerCase())
      );

      if (person && person.shortName && person.shortName.trim()) {
        const customShort = person.shortName.trim();
        const duplicates = staffDirectory.filter(p => p.shortName && p.shortName.trim().toLowerCase() === customShort.toLowerCase());
        if (duplicates.length <= 1) return customShort;
        return formatStandardShortName(person.name || raw);
      }
      return formatStandardShortName(raw);
    }

    function knownPeopleNames() {
      const names = new Set(staffList);
      allPlans.flatMap(p => String(p.assignee || "").split(",")).forEach(n => names.add(n.trim()));
      allPlans.flatMap(p => allPlanSteps(p)).forEach(step => (step.assignees || []).forEach(n => names.add(String(n || "").trim())));
      return [...names].filter(Boolean).sort();
    }

    function filterNamesByTag(names, tagVal) {
      const val = String(tagVal || "").trim().toLowerCase();
      if (!val) return names;
      const matches = names.filter(name => {
        const person = staffDirectory.find(p =>
          (p.name && p.name.toLowerCase() === name.toLowerCase()) ||
          (p.username && p.username.toLowerCase() === name.toLowerCase())
        );
        if (!person) return false;
        const dept = (person.dept || "").toLowerCase();
        const labels = (person.labels || "").toLowerCase();
        return (dept && (dept.includes(val) || val.includes(dept))) || (labels && (labels.includes(val) || val.includes(labels)));
      });
      return matches.length > 0 ? matches : names;
    }

    // ===== Task 3 & 4: CRUD Phase/Step & UI Rendering =====
    let phaseAccordionPlanId = null;
    const openPhaseIds = new Set();
    function ensurePhaseAccordion(planId, currentId) {
      if (phaseAccordionPlanId !== planId) {
        phaseAccordionPlanId = planId;
        openPhaseIds.clear();
        if (currentId) openPhaseIds.add(currentId);
      }
    }
    window.togglePhaseExpand = function (planId, phaseId) {
      if (openPhaseIds.has(phaseId)) openPhaseIds.delete(phaseId);
      else openPhaseIds.add(phaseId);
      openTaskDetail(planId);
    };
    function phaseWhoText(phase) {
      const steps = phase.steps || [];
      if (phase.status === "done") {
        const bys = [...new Set(steps.filter(s => s.doneBy).map(s => s.doneBy))];
        return bys.length ? bys.map(getShortName).join(", ") + " · đã xong" : "đã xong";
      }
      const names = [...new Set(steps.flatMap(s => s.assignees || []).filter(Boolean))];
      if (!names.length) return "";
      return names.map((n, i) => (i === 0 ? "★" : "○") + getShortName(n)).join(" ");
    }

    async function updatePlanPhases(planId, mutateFn) {
      const plan = allPlans.find(p => p.id === planId);
      if (!plan) return;
      const phases = planPhases(plan);
      mutateFn(phases);
      plan.phases = JSON.stringify(phases);
      const steps = allPlanSteps(plan);
      if (steps.length > 0) plan.status = steps.every(s => s.done) ? "Hoàn thành" : "Đang làm";
      
      const user = typeof BD_SSO !== 'undefined' ? BD_SSO.getUser() : null;
      const currentUserName = user ? (user.fullName || user.name) : "KTV";
      
      try {
        await window.bdsApiPost('savePlan', {
          id: plan.id, phases: plan.phases, status: plan.status,
          date: plan.date, task: plan.task, updatedBy: currentUserName
        });
      } catch (e) { console.error("Lỗi cập nhật phase:", e); }
      openTaskDetail(planId); 
    }

    window.addPhase = function (planId) {
      const name = prompt("Tên giai đoạn mới (vd Khảo sát, Vật tư, Thi công, Nghiệm thu):");
      if (!name || !name.trim()) return;
      updatePlanPhases(planId, phases => {
        phases.push({
          id: "PHASE-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name: name.trim(), order: phases.length + 1, status: "todo", steps: []
        });
      });
    };

    window.renamePhase = function (planId, phaseId) {
      const plan = allPlans.find(item => item.id === planId);
      const phase = plan && planPhases(plan).find(p => p.id === phaseId);
      if (!phase) return;
      const name = prompt("Tên giai đoạn:", phase.name || "");
      if (name === null || !name.trim()) return;
      updatePlanPhases(planId, phases => {
        const ph = phases.find(p => p.id === phaseId);
        if (ph) ph.name = name.trim();
      });
    };

    window.deletePhase = function (planId, phaseId) {
      if (!confirm("Xoá giai đoạn này? Các bước trong giai đoạn sẽ bị xoá theo.")) return;
      updatePlanPhases(planId, phases => {
        const index = phases.findIndex(p => p.id === phaseId);
        if (index >= 0) phases.splice(index, 1);
      });
    };

    window.addPhaseStep = function (planId, phaseId) {
      const title = prompt("Tên bước mới:");
      if (!title || !title.trim()) return;
      updatePlanPhases(planId, phases => {
        const phase = phases.find(p => p.id === phaseId);
        if (!phase) return;
        if (!phase.steps) phase.steps = [];
        phase.steps.push({
          id: "STEP-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          title: title.trim(), assignees: [], done: false, doneAt: "", doneBy: "", photos: []
        });
        rollUpPhaseStatus_(phase);
      });
    };

    window.renamePhaseStep = function (planId, phaseId, stepId) {
      const plan = allPlans.find(item => item.id === planId);
      const phase = plan && planPhases(plan).find(p => p.id === phaseId);
      const step = phase && (phase.steps || []).find(s => s.id === stepId);
      if (!step) return;
      const title = prompt("Tên bước:", step.title || "");
      if (title === null || !title.trim()) return;
      updatePlanPhases(planId, phases => {
        const ph = phases.find(p => p.id === phaseId);
        const s = ph && (ph.steps || []).find(x => x.id === stepId);
        if (s) s.title = title.trim();
      });
    };

    window.deletePhaseStep = function (planId, phaseId, stepId) {
      if (!confirm("Xoá bước này?")) return;
      updatePlanPhases(planId, phases => {
        const phase = phases.find(p => p.id === phaseId);
        if (!phase) return;
        const index = (phase.steps || []).findIndex(s => s.id === stepId);
        if (index >= 0) phase.steps.splice(index, 1);
        rollUpPhaseStatus_(phase);
      });
    };

    window.togglePhaseStepDone = function (planId, phaseId, stepId) {
      updatePlanPhases(planId, phases => {
        const phase = phases.find(p => p.id === phaseId);
        const step = phase && (phase.steps || []).find(s => s.id === stepId);
        if (!step) return;
        step.done = !step.done;
        step.doneAt = step.done ? new Date().toISOString() : "";
        const user = typeof BD_SSO !== 'undefined' ? BD_SSO.getUser() : null;
        step.doneBy = step.done ? (user ? (user.fullName || user.name) : "") : "";
        step.doneByPeople = step.done ? (step.assignees || []).slice() : [];
        rollUpPhaseStatus_(phase);
      });
    };

    window.addPhaseStepAssignee = function (planId, phaseId, stepId, rawName) {
      let name = rawName;
      if (name === "__other__") name = prompt("Tên người thực hiện:") || "";
      if (!name || !name.trim()) return;
      updatePlanPhases(planId, phases => {
        const phase = phases.find(p => p.id === phaseId);
        const step = phase && (phase.steps || []).find(s => s.id === stepId);
        if (!step) return;
        if (!step.assignees) step.assignees = [];
        if (!step.assignees.some(n => normalizePerson(n) === normalizePerson(name))) step.assignees.push(name.trim());
      });
    };

    window.removePhaseStepAssignee = function (planId, phaseId, stepId, name) {
      updatePlanPhases(planId, phases => {
        const phase = phases.find(p => p.id === phaseId);
        const step = phase && (phase.steps || []).find(s => s.id === stepId);
        if (!step) return;
        step.assignees = (step.assignees || []).filter(n => normalizePerson(n) !== normalizePerson(name));
      });
    };

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function phaseStepAssigneeEditorHtml(plan, phaseId, step) {
      const names = step.assignees || [];
      const chips = names.map(name => `
        <span class="step-chip" title="${escapeAttr(name)}">${escapeHtml(getShortName(name))}<button type="button" aria-label="Bỏ ${escapeAttr(name)}" onclick="event.stopPropagation(); removePhaseStepAssignee('${escapeAttr(plan.id)}','${escapeAttr(phaseId)}','${escapeAttr(step.id)}','${escapeAttr(name)}')">&times;</button></span>
      `).join("");
      const taken = new Set(names.map(normalizePerson));
      const options = filterNamesByTag(knownPeopleNames().filter(n => !taken.has(normalizePerson(n))), plan.team);
      const selectTitle = plan.team ? `Lọc theo tổ: ${escapeAttr(plan.team)}` : "Gán người thực hiện";
      const select = `
        <select class="step-add-select" title="${selectTitle}" onclick="event.stopPropagation()" onchange="addPhaseStepAssignee('${escapeAttr(plan.id)}','${escapeAttr(phaseId)}','${escapeAttr(step.id)}', this.value); this.value='';">
          <option value="">+ Gán người</option>
          ${options.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(getShortName(n))}</option>`).join("")}
          <option value="__other__">➔ Nhập tên khác...</option>
        </select>`;
      return `<div class="step-assignees">${chips}${select}</div>`;
    }

    function photoThumbsHtml(photos) {
      const list = Array.isArray(photos) ? photos : [];
      if (!list.length) return "";
      return `<div class="photo-thumbs">${list.map(p => `
        <a class="photo-thumb" href="${escapeAttr(p.url)}" target="_blank" rel="noopener" title="${escapeAttr(p.by || "")}${p.at ? " · " + escapeAttr(friendlyDate(String(p.at).slice(0, 10))) : ""}">
          <img src="${escapeAttr(p.url)}" alt="Ảnh đính kèm" loading="lazy">
        </a>`).join("")}</div>`;
    }

    function phaseStepRowHtml(plan, phase, step) {
      return `
        <div class="step-row${step.done ? " done" : ""}">
          <button class="step-check${step.done ? " done" : ""}" type="button"
                  title="${step.done ? "Bỏ đánh dấu xong" : "Đánh dấu xong"}"
                  onclick="togglePhaseStepDone('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}','${escapeAttr(step.id)}')">
            <i class="bi ${step.done ? "bi-check-lg" : "bi-circle"}"></i>
          </button>
          <div class="step-body min-w-0">
            <div class="step-title" onclick="renamePhaseStep('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}','${escapeAttr(step.id)}')">${escapeHtml(step.title || "Bước chưa đặt tên")}</div>
            ${phaseStepAssigneeEditorHtml(plan, phase.id, step)}
            ${photoThumbsHtml(step.photos)}
            ${stepPeopleProgressHtml(step)}
          </div>
          <div class="step-actions">
            <button class="step-icon-btn text-danger" type="button" title="Xoá bước" onclick="deletePhaseStep('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}','${escapeAttr(step.id)}')"><i class="bi bi-trash"></i></button>
          </div>
        </div>`;
    }

    function phaseCardBodyHtml(plan, phase, isCurrent) {
      const steps = phase.steps || [];
      const doneCount = steps.filter(s => s.done).length;
      const dotClass = phase.status === "done" ? "done" : phase.status === "doing" ? "cur" : "todo";
      const dotIcon = phase.status === "done" ? "bi-check-lg" : phase.status === "doing" ? "bi-play-fill" : "bi-circle";
      const expanded = openPhaseIds.has(phase.id);
      const who = phaseWhoText(phase);
      return `
        <div class="phase-block${isCurrent ? " phase-current" : ""}">
          <div class="phase-head" onclick="togglePhaseExpand('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}')">
            <span class="phase-dot phase-dot-${dotClass}"><i class="bi ${dotIcon}"></i></span>
            <div class="phase-main">
              <div class="phase-name">${escapeHtml(phase.name || "Giai đoạn")}</div>
              ${who ? `<div class="phase-who">${escapeHtml(who)}</div>` : ""}
            </div>
            <span class="phase-count">${steps.length ? `${doneCount}/${steps.length}` : ""}</span>
            <i class="bi bi-chevron-${expanded ? "up" : "down"} phase-caret"></i>
          </div>
          ${expanded ? `
            ${steps.length ? `<div class="step-list">${steps.map(step => phaseStepRowHtml(plan, phase, step)).join("")}</div>` : ""}
            <div class="phase-foot">
              <button class="add-step-link" type="button" onclick="event.stopPropagation(); addPhaseStep('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}')"><i class="bi bi-plus-lg"></i> Thêm bước</button>
              <button class="phase-mini" type="button" title="Đổi tên giai đoạn" onclick="event.stopPropagation(); renamePhase('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}')"><i class="bi bi-pencil"></i></button>
              <button class="phase-mini text-danger" type="button" title="Xoá giai đoạn" onclick="event.stopPropagation(); deletePhase('${escapeAttr(plan.id)}','${escapeAttr(phase.id)}')"><i class="bi bi-trash"></i></button>
            </div>
          ` : ""}
        </div>`;
    }

    function renderPhasesAndSteps(plan) {
      const phases = planPhases(plan).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
      if (phases.length === 0) return `<button class="btn btn-sm btn-outline-primary rounded-pill mb-3" type="button" onclick="addPhase('${escapeAttr(plan.id)}')"><i class="bi bi-plus-lg"></i> Thêm giai đoạn</button>`;
      const totalSteps = phases.reduce((n, ph) => n + (ph.steps || []).length, 0);
      const doneSteps = phases.reduce((n, ph) => n + (ph.steps || []).filter(s => s.done).length, 0);
      const firstDoing = phases.find(p => p.status === "doing");
      const firstTodo = phases.find(p => p.status !== "done");
      const current = firstDoing || firstTodo || phases[phases.length - 1];
      const currentIndex = current ? phases.findIndex(p => p.id === current.id) : -1;
      ensurePhaseAccordion(plan.id, current && current.id);
      return `
        <div class="d-sec phases-container">
          <div class="d-flex align-items-center justify-content-between gap-2">
            <div class="d-lab mb-0"><span class="n">✓</span>Giai đoạn &amp; bước${totalSteps ? ` — GĐ ${currentIndex + 1}/${phases.length} · ${doneSteps}/${totalSteps} bước` : ` (${phases.length})`}</div>
            <button class="btn btn-sm btn-outline-primary rounded-pill" type="button" onclick="addPhase('${escapeAttr(plan.id)}')"><i class="bi bi-plus-lg"></i> Thêm giai đoạn</button>
          </div>
          <div class="phase-list mt-2">${phases.map(phase => phaseCardBodyHtml(plan, phase, current && phase.id === current.id)).join("")}</div>
        </div>`;
    }

    // ===== Giai Đoạn & Bước Helpers (Ported from P4) =====
    function normalizePerson(value) {
      return String(value || "").trim().toLowerCase();
    }

    function formatStandardShortName(rawName) {
      if (!rawName) return "";
      const raw = String(rawName).trim();
      if (!raw) return "";

      const parts = raw.split(/\s+/);
      if (parts.length <= 2) return raw; // Ví dụ "Thắng NQ", "Hậu DV" -> đã ngắn gọn chuẩn

      const mainName = parts[parts.length - 1]; // "Thắng", "Hậu"
      const initials = parts.slice(0, parts.length - 1).map(p => p.charAt(0).toUpperCase()).join("");
      return `${mainName} ${initials}`; // "Thắng NQ", "Hậu DV"
    }

    function planPhases(plan) {
      if (!plan || !plan.phases) return [];
      try {
        const parsed = JSON.parse(plan.phases);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) { return []; }
    }

    function allPlanSteps(plan) {
      return planPhases(plan).flatMap(ph => ph.steps || []);
    }

    function findAnyStep(plan, stepId) {
      if (!plan || !stepId) return null;
      for (const ph of planPhases(plan)) {
        const found = (ph.steps || []).find(s => s.id === stepId);
        if (found) return found;
      }
      return null;
    }

    function findStepWithPhase(plan, stepId) {
      if (!plan || !stepId) return null;
      for (const ph of planPhases(plan)) {
        const found = (ph.steps || []).find(s => s.id === stepId);
        if (found) return { step: found, phaseName: ph.name || "" };
      }
      return null;
    }

    function stepDoneInfo(step) {
      const assignees = (step && step.assignees) || [];
      const doneNames = (step && step.doneByPeople) || [];
      const doneSet = new Set(doneNames.map(normalizePerson));
      const total = assignees.length;
      const doneCount = total ? assignees.filter(a => doneSet.has(normalizePerson(a))).length : (step && step.done ? 1 : 0);
      return { assignees, doneNames, total, doneCount, allDone: Boolean(step && step.done) };
    }

    function markStepDoneByPeople(step, people, fallbackBy) {
      if (!step) return;
      const wasDone = step.done === true;
      if (!Array.isArray(step.doneByPeople)) step.doneByPeople = [];
      const names = (people && people.length ? people : [fallbackBy]).filter(Boolean);
      names.forEach(nm => {
        if (!step.doneByPeople.some(n => normalizePerson(n) === normalizePerson(nm))) step.doneByPeople.push(nm);
      });
      const assignees = step.assignees || [];
      const doneSet = new Set(step.doneByPeople.map(normalizePerson));
      const allDone = assignees.length === 0 ? true : assignees.every(a => doneSet.has(normalizePerson(a)));
      step.done = wasDone || allDone;
      step.doneAt = new Date().toISOString();
      step.doneBy = names[names.length - 1] || fallbackBy || "";
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return "";
      return String(unsafe).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function friendlyDate(isoDate) {
      if (!isoDate) return "";
      const d = new Date(isoDate);
      if (isNaN(d)) return isoDate;
      const t = new Date();
      if (d.toDateString() === t.toDateString()) return "Hôm nay";
      t.setDate(t.getDate() - 1);
      if (d.toDateString() === t.toDateString()) return "Hôm qua";
      return d.toLocaleDateString('vi-VN');
    }

    function stepPeopleProgressHtml(step) {
      const info = stepDoneInfo(step);
      if (step.done) {
        const by = step.doneBy ? escapeHtml(getShortName(step.doneBy)) + " đã xong" : "Đã xong";
        return `<div class="step-done-note"><i class="bi bi-check2-circle me-1"></i>${by}${step.doneAt ? " · " + friendlyDate(step.doneAt.slice(0, 10)) : ""}</div>`;
      }
      if (info.total > 1 && info.doneCount > 0) {
        const doneList = (info.doneNames || []).map(n => escapeHtml(getShortName(n))).join(", ");
        return `<div class="step-progress-people"><i class="bi bi-people me-1"></i>${info.doneCount}/${info.total} người đã xong${doneList ? " · " + doneList : ""}</div>`;
      }
      return "";
    }

    function rollUpPhaseStatus_(phase) {
      if (!phase) return;
      const steps = phase.steps || [];
      phase.status = steps.length === 0 ? "todo" : steps.every(s => s.done) ? "done" : steps.some(s => s.done) ? "doing" : "todo";
    }
  </script>
</body>
</html>
