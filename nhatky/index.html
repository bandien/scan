<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nhật ký công việc | BanDienScan Zalo Style</title>
  <meta name="description" content="Quản lý công việc & Checklist vận hành - Zalo Layout">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0084FF">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230084FF'/%3E%3Ctext x='50' y='70' font-family='Arial,Helvetica,sans-serif' font-size='52' font-weight='900' fill='white' text-anchor='middle'%3EBD%3C/text%3E%3C/svg%3E">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --zalo-blue: #0084FF;
      --zalo-bg: #FFFFFF;
      --zalo-text: #000000;
      --zalo-subtext: #72767d;
      --zalo-badge: #E51C23;
      --zalo-line: #F0F0F0;
    }
    body {
      min-height: 100dvh;
      background: #e9ebe8;
      color: var(--zalo-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
    }
    .app-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--zalo-bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 1. Header (Thanh tìm kiếm & Công cụ) - Màu Xanh Dương */
    .zalo-header {
      background: var(--zalo-blue);
      color: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .zalo-search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .zalo-search-wrap i {
      position: absolute;
      left: 12px;
      color: #FFFFFF;
      font-size: 1.1rem;
    }
    .zalo-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 20px;
      padding: 6px 12px 6px 36px;
      color: #FFFFFF;
      font-size: 0.92rem;
      outline: none;
    }
    .zalo-search-input::placeholder { color: rgba(255, 255, 255, 0.85); }
    .zalo-header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #FFFFFF;
      font-size: 1.3rem;
    }
    .zalo-header-actions i { cursor: pointer; }

    /* 2. Sub-header (Tab phân loại) - Background Trắng - 3 Tab */
    .zalo-subheader {
      background: #FFFFFF;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--zalo-line);
    }
    .zalo-subtab {
      padding: 12px 0;
      margin-right: 20px;
      font-size: 0.92rem;
      color: var(--zalo-subtext);
      cursor: pointer;
      position: relative;
      font-weight: 500;
    }
    .zalo-subtab.active {
      color: #000000;
      font-weight: 700;
      border-bottom: 2px solid #000000;
    }

    /* 3. Body (Danh sách cuộc trò chuyện - ListView) */
    .zalo-listview {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }
    .zalo-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--zalo-line);
      cursor: pointer;
      gap: 12px;
    }
    .zalo-item:active { background-color: #f7f7f7; }
    /* Avatar vuông bo góc, thể hiện ảnh đính kèm hoặc avatar người giao việc */
    .zalo-avatar-square {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0084FF, #0052cc);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
      overflow: hidden;
      object-fit: cover;
    }
    .zalo-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .zalo-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zalo-title {
      font-size: 0.98rem;
      color: #000000;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .zalo-subtitle {
      font-size: 0.84rem;
      color: var(--zalo-subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .zalo-status-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-height: 48px;
      flex-shrink: 0;
    }
    .zalo-time {
      font-size: 0.75rem;
      color: var(--zalo-subtext);
    }
    .zalo-status-icon-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      background: #eef2ff;
      color: #4f46e5;
    }

    /* 4. Bottom Navigation Bar (Thanh điều hướng dưới) */
    .zalo-bottomnav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-top: 1px solid var(--zalo-line);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0 8px;
      z-index: 100;
    }
    .zalo-nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--zalo-subtext);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      position: relative;
    }
    .zalo-nav-tab.active {
      color: var(--zalo-blue);
      font-weight: 600;
    }
    .zalo-nav-icon-wrap {
      position: relative;
      font-size: 1.4rem;
      line-height: 1;
      margin-bottom: 2px;
    }
    .zalo-nav-badge {
      position: absolute;
      top: -4px;
      right: -8px;
      background: var(--zalo-badge);
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 800;
      border-radius: 10px;
      padding: 1px 5px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. Header (Thanh tìm kiếm & QR / Plus Icons) -->
    <header class="zalo-header">
      <div class="zalo-search-wrap">
        <i class="bi bi-search"></i>
        <input type="search" class="zalo-search-input" placeholder="Search">
      </div>
      <div class="zalo-header-actions">
        <i class="bi bi-qr-code-scan" title="Quét QR"></i>
        <i class="bi bi-plus-lg" title="Tạo mới / Mở rộng" onclick="openQuickTaskModal()"></i>
      </div>
    </header>

    <!-- 2. Sub-header (Tab phân loại) - 3 Tab -->
    <div class="zalo-subheader">
      <div class="zalo-subtab active" id="tabWork" onclick="switchSubTab('work')">Việc cần làm</div>
      <div class="zalo-subtab" id="tabPlan" onclick="switchSubTab('plan')">Kế hoạch</div>
      <div class="zalo-subtab" id="tabChecklist" onclick="switchSubTab('checklist')">Checklist</div>
    </div>

    <!-- 3. Body (ListView danh sách việc Zalo style) -->
    <main class="zalo-listview" id="zaloListView">
      <!-- Direct JS Render -->
    </main>

    <!-- 4. Bottom Navigation Bar -->
    <nav class="zalo-bottomnav">
      <div class="zalo-nav-tab active">
        <div class="zalo-nav-icon-wrap">
          <i class="bi bi-chat-dots-fill"></i>
          <span class="zalo-nav-badge">5+</span>
        </div>
        <span>Công việc</span>
      </div>
      <div class="zalo-nav-tab">
        <div class="zalo-nav-icon-wrap"><i class="bi bi-person"></i></div>
        <span>Contacts</span>
      </div>
      <div class="zalo-nav-tab">
        <div class="zalo-nav-icon-wrap">
          <i class="bi bi-grid"></i>
          <span class="zalo-nav-badge" style="width: 8px; height: 8px; padding: 0; top: 0; right: 0;"></span>
        </div>
        <span>Discovery</span>
      </div>
      <div class="zalo-nav-tab">
        <div class="zalo-nav-icon-wrap"><i class="bi bi-person-circle"></i></div>
        <span>Me</span>
      </div>
    </nav>
  </div>

  <!-- Modal Ghi Nhanh Việc Nhỏ / Ghi Hộ -->
  <div class="modal fade" id="quickTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-primary"><i class="bi bi-plus-circle-fill me-2"></i>Tạo Việc Mới / Ghi Hộ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="quickTaskForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Tên công việc / Sự cố *</label>
              <input type="text" id="qtTask" class="form-control" placeholder="Tên công việc..." required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Vị trí / Khu vực</label>
              <input type="text" id="qtArea" class="form-control" placeholder="Ví dụ: Tầng hầm B1...">
            </div>
            <div class="mb-3 p-2 bg-light rounded-3 border" id="proxyLoggingSection">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="qtIsProxy">
                <label class="form-check-input-label small fw-bold text-primary" for="qtIsProxy">
                  Tổ trưởng / Quản lý ghi hộ cho nhân viên
                </label>
              </div>
              <div class="mt-2 d-none" id="qtProxyWorkerWrap">
                <select id="qtWorker" class="form-select form-select-sm">
                  <option value="Thắng NQ">Thắng NQ</option>
                  <option value="Hậu DV">Hậu DV</option>
                  <option value="Hoàng HV">Hoàng HV</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Lưu & Tạo Việc</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const zaloPlans = [
      {
        id: "P1",
        title: "Kiểm tra nhiệt độ đầu cốt tủ MSB-B1",
        sender: "Thắng NQ",
        taskNote: "Đang đo camera nhiệt và siết ốc cốt",
        time: "1 hour",
        progressBadge: "1/2"
      },
      {
        id: "P2",
        title: "[SỰ CỐ CHECKLIST] Bơm tưới TB1 tụt áp gas",
        sender: "Checklist System",
        taskNote: "Phát hiện tụt áp khi chốt ca sáng",
        time: "1 second",
        progressBadge: "0/1"
      },
      {
        id: "P3",
        title: "Bảo dưỡng định kỳ máy phát điện dự phòng 1000kVA",
        sender: "Hậu DV",
        taskNote: "Đã kiểm tra mức dầu và ắc quy",
        time: "14:20",
        progressBadge: "3/3"
      }
    ];

    function renderZaloListView() {
      const container = document.getElementById("zaloListView");
      container.innerHTML = zaloPlans.map(item => `
        <div class="zalo-item" onclick="openTaskDetail('${item.id}')">
          <div class="zalo-avatar">${item.sender.charAt(0)}</div>
          <div class="zalo-content">
            <div class="zalo-title">${item.title}</div>
            <div class="zalo-subtitle">${item.sender}: ${item.taskNote}</div>
          </div>
          <div class="zalo-status-col">
            <div class="zalo-time">${item.time}</div>
            <div class="zalo-unread-badge">${item.progressBadge}</div>
          </div>
        </div>
      `).join("");
    }

    let quickModalInstance;
    document.addEventListener("DOMContentLoaded", () => {
      quickModalInstance = new bootstrap.Modal(document.getElementById("quickTaskModal"));
      renderZaloListView();

      document.getElementById("qtIsProxy").addEventListener("change", (e) => {
        document.getElementById("qtProxyWorkerWrap").classList.toggle("d-none", !e.target.checked);
      });

      document.getElementById("quickTaskForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const task = document.getElementById("qtTask").value;
        const isProxy = document.getElementById("qtIsProxy").checked;
        const sender = isProxy ? document.getElementById("qtWorker").value : "Tài khoản hiện tại";

        zaloPlans.unshift({
          id: "P-" + Date.now(),
          title: task,
          sender: sender,
          taskNote: isProxy ? "(Tổ trưởng ghi hộ)" : "Vừa khởi tạo",
          time: "1 second",
          progressBadge: "0/1"
        });

        renderZaloListView();
        quickModalInstance.hide();
        document.getElementById("quickTaskForm").reset();
      });
    });

    function switchSubTab(type) {
      document.getElementById("tabWork").classList.toggle("active", type === 'work');
      document.getElementById("tabChecklist").classList.toggle("active", type === 'checklist');
    }

    function openQuickTaskModal() { quickModalInstance.show(); }
    function openTaskDetail(id) { alert("Mở chi tiết công việc " + id); }
  </script>
</body>
</html>
