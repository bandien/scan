<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Cơ Điện Sân Golf | BanDienScan</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/shared.css?v=20260721-menuplus" rel="stylesheet">
    <style>
        :root {
            --golf-bg: #eef7f1;
            --golf-card: #ffffff;
            --golf-line: #dbe7df;
            --golf-text: #0f172a;
            --golf-muted: #64748b;
            --golf-green: #059669;
            --golf-green-soft: #dcfce7;
            --golf-blue: #2563eb;
            --golf-amber: #f59e0b;
            --golf-red: #ef4444;
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(16,185,129,.18), transparent 36%),
                linear-gradient(180deg, #f3fbf6 0%, var(--golf-bg) 100%);
            color: var(--golf-text);
            font-family: Inter, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 96px;
        }
        .shell { max-width: 560px; margin: 0 auto; padding: 14px; }
        .panel {
            background: rgba(255,255,255,.94);
            border: 1px solid var(--golf-line);
            border-radius: 24px;
            box-shadow: 0 14px 34px rgba(15,23,42,.07);
            padding: 16px;
            margin-bottom: 12px;
        }
        .hero {
            background: linear-gradient(135deg, #047857, #10b981);
            color: #fff;
            border: 0;
            overflow: hidden;
            position: relative;
        }
        .hero:after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 999px;
            right: -68px;
            top: -76px;
            background: rgba(255,255,255,.16);
        }
        .hero h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 4px; }
        .hero p { margin: 0; opacity: .86; font-weight: 600; font-size: .88rem; }
        .mini-label {
            display: block;
            color: var(--golf-muted);
            font-size: .76rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .soft-input, .soft-select, .soft-textarea {
            width: 100%;
            border: 1.5px solid var(--golf-line);
            border-radius: 16px;
            background: #fff;
            padding: 11px 13px;
            font-weight: 700;
            color: var(--golf-text);
        }
        .soft-input:focus, .soft-select:focus, .soft-textarea:focus {
            border-color: var(--golf-green);
            outline: none;
            box-shadow: 0 0 0 4px rgba(5,150,105,.12);
        }
        .date-row { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; }
        .icon-btn {
            border: 1.5px solid var(--golf-line);
            background: #fff;
            border-radius: 15px;
            min-height: 44px;
            color: var(--golf-text);
            font-weight: 800;
        }
        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 16px 4px 10px;
        }
        .section-heading h2 { font-size: .98rem; font-weight: 800; margin: 0; }
        .section-heading span { color: var(--golf-muted); font-size: .78rem; font-weight: 700; }
        .task-card {
            width: 100%;
            border: 1.5px solid var(--golf-line);
            background: #fff;
            border-radius: 22px;
            padding: 15px;
            margin-bottom: 10px;
            text-align: left;
            box-shadow: 0 8px 22px rgba(15,23,42,.045);
        }
        .task-card:active { transform: scale(.985); }
        .task-icon {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: var(--golf-green-soft);
            color: var(--golf-green);
            font-size: 1.25rem;
        }
        .task-title { font-weight: 800; line-height: 1.22; }
        .task-meta { color: var(--golf-muted); font-size: .8rem; font-weight: 700; margin-top: 3px; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: .73rem;
            font-weight: 800;
        }
        .pill.gray { background: #f1f5f9; color: #475569; }
        .pill.green { background: #dcfce7; color: #047857; }
        .pill.amber { background: #fef3c7; color: #92400e; }
        .pill.blue { background: #dbeafe; color: #1d4ed8; }
        .pill.red { background: #fee2e2; color: #b91c1c; }
        .progress-line {
            height: 9px;
            border-radius: 999px;
            overflow: hidden;
            background: #e2e8f0;
            margin-top: 12px;
        }
        .progress-line > div {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: var(--golf-green);
            transition: width .2s ease;
        }
        .run-top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(238,247,241,.94);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            margin: -4px 0 6px;
        }
        .run-title { font-size: 1.04rem; font-weight: 800; margin: 0; }
        .run-sub { color: var(--golf-muted); font-size: .78rem; font-weight: 700; }
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .primary-btn, .secondary-btn, .danger-btn {
            border: 0;
            border-radius: 16px;
            min-height: 46px;
            padding: 10px 12px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .primary-btn { background: var(--golf-green); color: #fff; box-shadow: 0 9px 20px rgba(5,150,105,.22); }
        .secondary-btn { background: #fff; color: var(--golf-text); border: 1.5px solid var(--golf-line); }
        .danger-btn { background: #fee2e2; color: #991b1b; }
        .item-card {
            background: #fff;
            border: 1.5px solid var(--golf-line);
            border-radius: 22px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .item-card.done { border-color: #86efac; background: #fbfffd; }
        .item-card.warn { border-color: #fca5a5; background: #fffafa; }
        .item-head { display: flex; gap: 10px; align-items: flex-start; }
        .item-index {
            min-width: 30px;
            height: 30px;
            border-radius: 12px;
            background: #f1f5f9;
            display: grid;
            place-items: center;
            font-size: .78rem;
            font-weight: 800;
            color: #475569;
        }
        .item-label { font-weight: 800; line-height: 1.35; }
        .item-note { color: var(--golf-muted); font-size: .78rem; font-weight: 600; margin-top: 3px; }
        .check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .check-btn {
            border: 1.5px solid var(--golf-line);
            border-radius: 15px;
            background: #fff;
            padding: 10px 4px;
            font-size: .8rem;
            font-weight: 800;
        }
        .check-btn.ok.active { background: var(--golf-green); border-color: var(--golf-green); color: #fff; }
        .check-btn.ng.active { background: var(--golf-red); border-color: var(--golf-red); color: #fff; }
        .check-btn.skip.active { background: #64748b; border-color: #64748b; color: #fff; }
        .field-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .unit { color: var(--golf-muted); font-weight: 800; min-width: 38px; }
        .bad { border-color: var(--golf-red) !important; background: #fff1f2; color: #b91c1c; }
        .warn-text { color: #b91c1c; font-size: .76rem; font-weight: 800; margin-top: 6px; }
        .note-box {
            width: 100%;
            border: 1.5px dashed #cbd5e1;
            border-radius: 15px;
            padding: 10px 12px;
            margin-top: 10px;
            font-weight: 600;
            min-height: 42px;
        }
        .readonly input, .readonly textarea, .readonly button[data-edit] { pointer-events: none; opacity: .78; }
        .empty-state { text-align: center; color: var(--golf-muted); padding: 34px 16px; font-weight: 700; }
        .toast-lite {
            position: fixed;
            left: 50%;
            bottom: 92px;
            transform: translateX(-50%);
            z-index: 2000;
            background: #0f172a;
            color: #fff;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: .84rem;
            font-weight: 800;
            box-shadow: 0 10px 28px rgba(15,23,42,.24);
            display: none;
        }

        /* Đợt 1 & 3: Stepper +/- & Previous value chip & TOC navigation */
        .btn-prev-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: .74rem;
            font-weight: 800;
            margin-top: 6px;
            cursor: pointer;
            transition: all .15s ease;
        }
        .btn-prev-chip:active {
            background: #dbeafe;
            transform: scale(.97);
        }
        .stepper-row {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }
        .stepper-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1.5px solid var(--golf-line);
            background: #f8fafc;
            color: var(--golf-text);
            font-weight: 800;
            font-size: 1.1rem;
            display: grid;
            place-items: center;
            user-select: none;
            flex-shrink: 0;
        }
        .stepper-btn:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }
        .toc-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 4px;
            margin: -2px 0 10px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .toc-bar::-webkit-scrollbar { display: none; }
        .toc-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: .76rem;
            font-weight: 800;
            background: #ffffff;
            border: 1.5px solid var(--golf-line);
            color: var(--golf-text);
            white-space: nowrap;
            cursor: pointer;
        }
        .toc-chip.done {
            border-color: #86efac;
            background: #f0fdf4;
            color: #166534;
        }
        .toc-next-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: .76rem;
            font-weight: 800;
            background: #fef3c7;
            border: 1.5px solid #fde68a;
            color: #92400e;
            white-space: nowrap;
            cursor: pointer;
        }
        .section-heading-toggle {
            cursor: pointer;
            user-select: none;
        }
        .section-heading-toggle:active { opacity: 0.8; }
        .item-card.highlight-flash {
            animation: flashBorder 1.5s ease;
        }
        @keyframes flashBorder {
            0%, 100% { box-shadow: 0 8px 22px rgba(15,23,42,.045); }
            50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.5); border-color: var(--golf-amber); }
        }
    </style>

<body>
<main class="shell">
    <section id="homeView">
        <div class="panel hero">
            <h1>Checklist Cơ Điện Sân Golf</h1>
            <p>Chọn ca, bấm Đạt/Lỗi, ghi phát sinh rồi chốt bàn giao. Gọn như một đường fairway đẹp.</p>
        </div>

        <div class="panel">
            <div class="row g-2">
                <div class="col-12">
                    <label class="mini-label"><i class="bi bi-person-badge me-1"></i>Người thực hiện</label>
                    <input id="operatorInput" class="soft-input" placeholder="Nhập họ tên...">
                </div>
                <div class="col-12">
                    <label class="mini-label"><i class="bi bi-calendar3 me-1"></i>Ngày checklist</label>
                    <div class="date-row">

                        <input id="datePicker" class="soft-input" type="date" onchange="onDateChange()">
                        <button class="icon-btn" onclick="shiftDate(1)" aria-label="Ngày sau"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </div>

        </div>

        <div id="pendingBanners"></div>

        <div class="section-heading">
            <h2>Việc cần làm</h2>
            <span id="homeSyncText">Đang tải...</span>
        </div>
        <div id="templateCards">
            <div class="panel empty-state"><span class="spinner-border spinner-border-sm me-2"></span>Đang tải checklist...</div>
        </div>
    </section>

    <section id="runView" style="display:none;">
        <div class="run-top">
            <div class="panel mb-0">
                <div class="d-flex align-items-center gap-2">
                    <button class="icon-btn" onclick="backHome()" aria-label="Quay lại"><i class="bi bi-arrow-left"></i></button>
                    <div class="flex-grow-1">
                        <h1 class="run-title" id="runTitle">Checklist</h1>
                        <div class="run-sub" id="runSub">—</div>

                    <span id="syncPill" class="pill green"><i class="bi bi-cloud-check"></i>Lưu</span>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-2">

                <div class="quick-actions" id="quickActions">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:22px;">

                <label class="mini-label mt-3">Người nhận bàn giao</label>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const LS_TEMPLATES = 'golf_templates_v2';
const LS_RUN_PREFIX = 'golf_run_';
const TEMPLATE_ORDER = ['ca_sang', 'ca_toi', 'tuan', 'thang'];
const TEMPLATE_ICONS = { ca_sang: 'bi-sunrise', ca_toi: 'bi-moon-stars', tuan: 'bi-calendar-week', thang: 'bi-calendar-month' };

let templates = [];
let serverRuns = {};
let currentRun = null;
let saveTimer = null;
let toastTimer = null;

const $ = id => document.getElementById(id);
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

function toast(message, type = 'dark') {
    if (window.bdsShowToast) return bdsShowToast(message, type === 'dark' ? 'success' : type);
    const el = $('toastLite');
    el.textContent = message;
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.style.display = 'none', 2400);
}
function getOperator() { return window.BD_SSO ? BD_SSO.getOperatorName() : ($('operatorInput')?.value || '').trim(); }
function selectedDate() { return $('datePicker').value || todayStr(); }
function golfRunId(templateId, date) { return 'GOLF-' + templateId + '-' + date.replace(/-/g, ''); }
function previousDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    d.setDate(d.getDate() - 1);
    return d.toLocaleDateString('sv-SE');
}
function isDue(templateId, dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    if (templateId === 'tuan') return d.getDay() === 1;
    if (templateId === 'thang') return d.getDate() === 1;
    return true;
}
function templateItems(templateId) {
    return templates
        .filter(x => x.templateId === templateId)
        .sort((a, b) => String(a.section).localeCompare(String(b.section), 'vi') || Number(a.order || 0) - Number(b.order || 0));
}
function templateName(templateId) {
    const it = templates.find(x => x.templateId === templateId);
    return it ? it.templateName : templateId;
}
function parseThreshold(spec) {
    const m = String(spec || '').match(/^(min|max|range):([\d.,-]+)$/);
    if (!m) return null;
    if (m[1] === 'range') {
        const parts = m[2].split('-').map(Number);
        return { type: 'range', lo: parts[0], hi: parts[1] };
    }
    return { type: m[1], val: Number(m[2]) };
}
function violates(spec, value) {
    const t = parseThreshold(spec);
    if (!t || value === '' || value == null || Number.isNaN(Number(value))) return false;
    const v = Number(value);
    if (t.type === 'min') return v < t.val;
    if (t.type === 'max') return v > t.val;
    return v < t.lo || v > t.hi;
}

async function loadTemplates() {
    const cached = localStorage.getItem(LS_TEMPLATES);
    if (cached) {
        try { templates = JSON.parse(cached).items || []; } catch (_) {}
        if (templates.length) renderHome();
    }
    try {
        const res = await bdsApiFetch('getGolfTemplates');
        if (res.status === 'success' && Array.isArray(res.items)) {
            templates = res.items;
            localStorage.setItem(LS_TEMPLATES, JSON.stringify({ items: templates, at: Date.now() }));
            renderHome();
        }
    } catch (err) {
        if (!templates.length) $('templateCards').innerHTML = '<div class="panel empty-state">Không tải được mẫu checklist. Kiểm tra mạng rồi mở lại trang.</div>';
    }
}
async function loadRuns() {
    $('homeSyncText').textContent = 'Đang đồng bộ...';
    const date = selectedDate();
    try {
        const res = await bdsApiFetch('getGolfRuns', { from: previousDate(date), to: date });
        if (res.status === 'success') {
            serverRuns = {};
            (res.runs || []).forEach(r => {
                try { r.itemsObj = r.items ? JSON.parse(r.items) : {}; } catch (_) { r.itemsObj = {}; }
                serverRuns[r.runId] = r;
            });
            $('homeSyncText').textContent = 'Đã cập nhật';
        }
    } catch (_) {
        $('homeSyncText').textContent = 'Đang offline';
    }
    renderHome();
}
function localDraft(runId) {
    try { return JSON.parse(localStorage.getItem(LS_RUN_PREFIX + runId)); } catch (_) { return null; }
}
function saveLocalDraft(run) { localStorage.setItem(LS_RUN_PREFIX + run.runId, JSON.stringify(run)); }
function runStateFor(templateId, date) {
    const runId = golfRunId(templateId, date);
    const server = serverRuns[runId];
    const draft = localDraft(runId);
    const items = draft && draft.dirty ? draft.items : (server ? server.itemsObj : (draft ? draft.items : {}));
    const status = server ? server.status : (draft ? 'draft' : '');
    const total = templateItems(templateId).length;
    const done = countDone(templateId, items || {});
    return { runId, server, draft, status, items: items || {}, total, done };
}
let collapsedSections = {};

function itemIsDone(item, val) {
    if (!val) return false;
    if (item.inputType === 'check') return !!val.status;
    if (item.inputType === 'timerange') {
        const v = val.value || {};
        return typeof v === 'object' && !!v.on && !!v.off;
    }
    if (item.inputType === 'group') {
        const v = val.value || {};
        const fields = item.fields || [];
        if (!fields.length) return false;
        return fields.every(f => {
            const fv = v[f.key];
            if (fv == null || fv === '') return false;
            if (f.type === 'timerange') {
                return typeof fv === 'object' && !!fv.on && !!fv.off;
            }
            return true;
        });
    }
    return val.value !== '' && val.value != null;
}
function countDone(templateId, items) {
    return templateItems(templateId).filter(it => itemIsDone(it, items[it.itemId])).length;
}
function hasViolation(item, val) {
    if (!val) return false;
    if (item.inputType === 'check') return val.status === 'ng';
    if (item.inputType === 'number') return violates(item.threshold, val.value);
    if (item.inputType === 'group') {
        const v = val.value || {};
        return (item.fields || []).some(f => f.type === 'number' && violates(f.threshold, v[f.key]));
    }
    return false;
}

function getPrevItemValue(itemId, subKey = null) {
    if (!currentRun) return null;
    const sortedRuns = Object.values(serverRuns)
        .filter(r => r.templateId === currentRun.templateId && r.date < currentRun.date)
        .sort((a, b) => b.date.localeCompare(a.date));

    for (const r of sortedRuns) {
        const items = r.itemsObj || {};
        if (items[itemId]) {
            const itemData = items[itemId];
            if (subKey) {
                const val = (itemData.value && typeof itemData.value === 'object') ? itemData.value[subKey] : null;
                if (val != null && val !== '') return { value: val, date: r.date };
            } else {
                if (itemData.value != null && itemData.value !== '') return { value: itemData.value, date: r.date };
            }
        }
    }
    const prevRunId = golfRunId(currentRun.templateId, previousDate(currentRun.date));
    const draft = localDraft(prevRunId);
    if (draft && draft.items && draft.items[itemId]) {
        const itemData = draft.items[itemId];
        if (subKey) {
            const val = (itemData.value && typeof itemData.value === 'object') ? itemData.value[subKey] : null;
            if (val != null && val !== '') return { value: val, date: draft.date };
        } else {
            if (itemData.value != null && itemData.value !== '') return { value: itemData.value, date: draft.date };
        }
    }
    return null;
}

function applyPrevValue(itemId, subKey = null) {
    if (isLocked()) return;
    const prev = getPrevItemValue(itemId, subKey);
    if (!prev) return toast('Không tìm thấy số ca trước', 'warning');
    if (subKey) {
        setGroup(itemId, subKey, prev.value);
    } else {
        setValue(itemId, prev.value);
    }
    toast('Đã lấy số ca trước: ' + prev.value);
}

function stepCmValue(itemId, delta, subKey = null) {
    if (isLocked()) return;
    let cur = null;
    if (subKey) {
        const v = itemVal(itemId).value || {};
        cur = Number(v[subKey]);
    } else {
        cur = Number(itemVal(itemId).value);
    }
    if (Number.isNaN(cur) || cur == null || cur === 0) {
        const prev = getPrevItemValue(itemId, subKey);
        cur = prev ? Number(prev.value) || 0 : 0;
    }
    const newVal = Math.max(0, Math.round((cur + delta) * 100) / 100);
    if (subKey) {
        setGroup(itemId, subKey, newVal);
    } else {
        setValue(itemId, newVal);
    }
}

function quickFillAll() {
    if (isLocked()) return;
    const items = templateItems(currentRun.templateId);
    let checkCount = 0;
    let numCount = 0;

    items.forEach(item => {
        if (item.inputType === 'check') {
            const v = itemVal(item.itemId);
            if (!v.status) {
                v.status = 'ok';
                checkCount++;
            }
        } else if (item.inputType === 'number') {
            const v = itemVal(item.itemId);
            if (v.value === '' || v.value == null) {
                const prev = getPrevItemValue(item.itemId);
                if (prev) {
                    v.value = prev.value;
                    numCount++;
                }
            }
        } else if (item.inputType === 'group') {
            const v = itemVal(item.itemId);
            if (!v.value || typeof v.value !== 'object') v.value = {};
            (item.fields || []).forEach(f => {
                if (f.type === 'number' && (v.value[f.key] === '' || v.value[f.key] == null)) {
                    const prev = getPrevItemValue(item.itemId, f.key);
                    if (prev) {
                        v.value[f.key] = prev.value;
                        numCount++;
                    }
                }
            });
        }
    });

    changed('', true);
    toast(`Đã đánh Đạt (${checkCount}) & điền ${numCount} số ca trước!`);
}

function statusPill(state) {
    if (state.status === 'confirmed') return '<span class="pill green"><i class="bi bi-patch-check"></i>Đã xác nhận</span>';
    if (state.status === 'submitted') return '<span class="pill blue"><i class="bi bi-send-check"></i>Đã chốt</span>';
    if (state.status === 'draft' || state.done > 0) return '<span class="pill amber"><i class="bi bi-pencil"></i>Đang làm</span>';
    return '<span class="pill gray">Chưa làm</span>';
}
function renderHome() {
    if (!templates.length) return;
    const date = selectedDate();
    const html = TEMPLATE_ORDER.filter(id => templates.some(x => x.templateId === id)).map(id => {
        const state = runStateFor(id, date);
        const pct = state.total ? Math.round(state.done / state.total * 100) : 0;
        const due = isDue(id, date);
        const dueText = id === 'tuan' ? 'Làm vào thứ Hai' : id === 'thang' ? 'Làm ngày 1 hằng tháng' : 'Làm hằng ngày';
        return `<button class="task-card" onclick="openRun('${id}')">
            <div class="d-flex align-items-center gap-3">
                <div class="task-icon"><i class="bi ${TEMPLATE_ICONS[id] || 'bi-clipboard-check'}"></i></div>
                <div class="flex-grow-1">
                    <div class="task-title">${esc(templateName(id))}</div>
                    <div class="task-meta">${state.done}/${state.total} mục · ${dueText}</div>
                </div>
                <i class="bi bi-chevron-right text-secondary"></i>
            </div>
            <div class="d-flex gap-2 flex-wrap mt-3">
                ${statusPill(state)}
                ${due ? '<span class="pill green">Đến lịch</span>' : '<span class="pill gray">Không bắt buộc hôm nay</span>'}
            </div>
            <div class="progress-line"><div style="width:${pct}%"></div></div>
        </button>`;
    }).join('');
    $('templateCards').innerHTML = html || '<div class="panel empty-state">Chưa có mẫu checklist.</div>';
    renderPendingBanners();
}
function renderPendingBanners() {
    const pending = Object.values(serverRuns).filter(r => r.status === 'submitted');
    $('pendingBanners').innerHTML = pending.map(r => `<div class="panel">
        <div class="fw-bold"><i class="bi bi-bell-fill text-primary me-1"></i>Chờ nhận bàn giao: ${esc(templateName(r.templateId))}</div>
        <div class="small text-secondary mt-1">Ngày ${esc(r.date)} · Người chốt: ${esc(r.operator || '—')}</div>
        ${r.handoverNote ? `<div class="small mt-2">${esc(r.handoverNote)}</div>` : ''}
        <button class="primary-btn w-100 mt-3" onclick="confirmHandover('${esc(r.runId)}')"><i class="bi bi-check2-circle"></i>Xác nhận đã nhận bàn giao</button>
    </div>`).join('');
}
async function confirmHandover(runId) {
    const me = getOperator();
    if (!me) return toast('Nhập người thực hiện trước', 'warning');
    try {
        const res = await bdsApiPost('confirmGolfHandover', { payload: { runId, confirmedBy: me } });
        if (res.status === 'success') {
            toast('Đã xác nhận bàn giao');
            await loadRuns();
        } else {
            toast(res.message || 'Không xác nhận được', 'danger');
        }
    } catch (err) { toast('Lỗi xác nhận: ' + err.message, 'danger'); }
}

function openRun(templateId) {
    const date = selectedDate();
    const state = runStateFor(templateId, date);
    currentRun = {
        runId: state.runId,
        templateId,
        date,
        status: state.status || 'draft',
        items: JSON.parse(JSON.stringify(state.items || {})),
        dirty: !!(state.draft && state.draft.dirty)
    };
    $('homeView').style.display = 'none';
    $('runView').style.display = '';
    $('runTitle').textContent = templateName(templateId);
    $('runSub').textContent = date + (getOperator() ? ' · ' + getOperator() : '');
    renderRun();
    window.scrollTo(0, 0);
}
function backHome() {
    flushSave();
    currentRun = null;
    $('runView').style.display = 'none';
    $('homeView').style.display = '';
    loadRuns();
}
function isLocked() { return currentRun && ['submitted', 'confirmed'].includes(currentRun.status); }

function renderRun() {
    const items = templateItems(currentRun.templateId);

    // Gom nhóm hạng mục theo section
    const sections = [];
    let curSec = null;
    items.forEach((item, idx) => {
        const secName = item.sectionTitle || item.section || 'Hạng mục';
        if (!curSec || curSec.key !== item.section) {
            curSec = { key: item.section, title: secName, items: [] };
            sections.push(curSec);
        }
        curSec.items.push({ item, index: idx + 1 });
    });

    // Render thanh Mục lục dính (TOC bar)
    let missingTotal = 0;
    const tocHtml = sections.map((sec, secIdx) => {
        const secDone = sec.items.every(x => itemIsDone(x.item, currentRun.items[x.item.itemId]));
        const secWarn = sec.items.filter(x => hasViolation(x.item, currentRun.items[x.item.itemId])).length;
        const secMissing = sec.items.filter(x => !itemIsDone(x.item, currentRun.items[x.item.itemId])).length;
        missingTotal += secMissing;
        return `<button class="toc-chip ${secDone ? 'done' : ''}" onclick="scrollToSection(${secIdx})">
            ${esc(sec.title)}
            ${secWarn ? `<span class="badge bg-danger">${secWarn}</span>` : ''}
            ${secMissing ? `<span class="badge bg-secondary">${secMissing}</span>` : ''}
        </button>`;
    }).join('');

    const nextBtnHtml = missingTotal > 0 ? `<button class="toc-next-btn" onclick="scrollToNextIncomplete()"><i class="bi bi-arrow-down-circle-fill me-1"></i>Chưa xong (${missingTotal})</button>` : '';

    const tocEl = $('tocArea');
    if (tocEl) {
        tocEl.style.display = 'flex';
        tocEl.innerHTML = nextBtnHtml + tocHtml;
    }

    // Render danh sách mục theo Section
    let html = '';
    sections.forEach((sec, secIdx) => {
        const isCollapsed = !!collapsedSections[sec.key];
        const secWarn = sec.items.filter(x => hasViolation(x.item, currentRun.items[x.item.itemId])).length;
        const secMissing = sec.items.filter(x => !itemIsDone(x.item, currentRun.items[x.item.itemId])).length;

        html += `<div class="section-heading section-heading-toggle" id="sec-head-${secIdx}" onclick="toggleSection('${esc(sec.key)}')">
            <div class="d-flex align-items-center gap-2">
                <i class="bi ${isCollapsed ? 'bi-chevron-right' : 'bi-chevron-down'} text-secondary"></i>
                <h2>${esc(sec.title)}</h2>
            </div>
            <div class="d-flex align-items-center gap-1">
                ${secWarn ? `<span class="pill red py-1 px-2"><i class="bi bi-exclamation-triangle-fill me-1"></i>${secWarn}</span>` : ''}
                ${secMissing ? `<span class="pill gray py-1 px-2">${secMissing} mục trống</span>` : '<span class="pill green py-1 px-2"><i class="bi bi-check-lg"></i>Đủ</span>'}
            </div>
        </div>`;

        if (!isCollapsed) {
            sec.items.forEach(x => {
                html += renderItem(x.item, x.index);
            });
        }
    });

    $('runBody').innerHTML = `<div class="${isLocked() ? 'readonly' : ''}">${html}</div>`;
    renderSubmitArea();
    updateProgress();
}

function toggleSection(secKey) {
    collapsedSections[secKey] = !collapsedSections[secKey];
    renderRun();
}

function scrollToSection(secIdx) {
    const el = $('sec-head-' + secIdx);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function scrollToNextIncomplete() {
    const cards = document.querySelectorAll('#runBody .item-card');
    for (const card of cards) {
        if (!card.classList.contains('done')) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('highlight-flash');
            setTimeout(() => card.classList.remove('highlight-flash'), 1500);
            return;
        }
    }
    toast('Tất cả các mục đã hoàn thành!');
}

function itemVal(itemId) {
    if (!currentRun.items[itemId]) currentRun.items[itemId] = {};
    return currentRun.items[itemId];
}
function renderItem(item, index) {
    const val = currentRun.items[item.itemId] || {};
    const done = itemIsDone(item, val);
    const warn = hasViolation(item, val);
    return `<article class="item-card ${done ? 'done' : ''} ${warn ? 'warn' : ''}" id="item-${esc(item.itemId)}">
        <div class="item-head">
            <div class="item-index">${index}</div>
            <div class="flex-grow-1">
                <div class="item-label">${esc(item.label)}</div>
                ${item.note ? `<div class="item-note"><i class="bi bi-info-circle me-1"></i>${esc(item.note)}</div>` : ''}
            </div>
        </div>
        ${renderInput(item, val)}
        <textarea class="note-box" data-edit placeholder="Ghi chú / phát sinh nếu có..." oninput="setNote('${esc(item.itemId)}', this.value)">${esc(val.note || '')}</textarea>
    </article>`;
}
function renderInput(item, val) {
    if (item.inputType === 'check') {
        const s = val.status || '';
        return `<div class="check-grid">
            <button data-edit class="check-btn ok ${s === 'ok' ? 'active' : ''}" onclick="setCheck('${esc(item.itemId)}','ok')"><i class="bi bi-check-lg"></i> Đạt</button>
            <button data-edit class="check-btn ng ${s === 'ng' ? 'active' : ''}" onclick="setCheck('${esc(item.itemId)}','ng')"><i class="bi bi-x-lg"></i> Lỗi</button>
            <button data-edit class="check-btn skip ${s === 'skip' ? 'active' : ''}" onclick="setCheck('${esc(item.itemId)}','skip')"><i class="bi bi-dash-lg"></i> Bỏ qua</button>
        </div>`;
    }
    if (item.inputType === 'number') {
        const bad = violates(item.threshold, val.value);
        const prev = getPrevItemValue(item.itemId);
        const isCm = item.unit === 'cm';
        
        let fieldHtml = '';
        if (isCm) {
            fieldHtml = `<div class="stepper-row">
                <button data-edit type="button" class="stepper-btn" onclick="stepCmValue('${esc(item.itemId)}', -1)">-</button>
                <input data-edit class="soft-input ${bad ? 'bad' : ''} text-center fw-bold" type="number" step="any" inputmode="decimal" value="${esc(val.value || '')}" placeholder="Nhập số đo" oninput="setValue('${esc(item.itemId)}', this.value)">
                <button data-edit type="button" class="stepper-btn" onclick="stepCmValue('${esc(item.itemId)}', 1)">+</button>
                <span class="unit">${esc(item.unit)}</span>
            </div>`;
        } else {
            fieldHtml = `<div class="field-row">
                <input data-edit class="soft-input ${bad ? 'bad' : ''}" type="number" step="any" inputmode="decimal" value="${esc(val.value || '')}" placeholder="Nhập số đo" oninput="setValue('${esc(item.itemId)}', this.value)">
                <span class="unit">${esc(item.unit)}</span>
            </div>`;
        }

        const prevBtn = (prev && (val.value === '' || val.value == null)) ?
            `<button data-edit type="button" class="btn-prev-chip" onclick="applyPrevValue('${esc(item.itemId)}')"><i class="bi bi-clock-history me-1"></i>Lấy số ca trước (${esc(prev.value)} ${esc(item.unit)})</button>` : '';

        return fieldHtml + prevBtn + (bad ? `<div class="warn-text"><i class="bi bi-exclamation-triangle-fill me-1"></i> Ngoài ngưỡng ${esc(item.threshold)}</div>` : '');
    }
    if (item.inputType === 'time') {
        return `<div class="field-row"><input data-edit class="soft-input" type="time" value="${esc(val.value || '')}" onchange="setValue('${esc(item.itemId)}', this.value)"></div>`;
    }
    if (item.inputType === 'timerange') {
        const v = val.value || {};
        return `<div class="row g-2 mt-1">
            <div class="col-6"><label class="mini-label">Giờ bật</label><input data-edit class="soft-input" type="time" value="${esc(v.on || '')}" onchange="setRange('${esc(item.itemId)}','on',this.value)"></div>
            <div class="col-6"><label class="mini-label">Giờ tắt</label><input data-edit class="soft-input" type="time" value="${esc(v.off || '')}" onchange="setRange('${esc(item.itemId)}','off',this.value)"></div>
        </div>`;
    }
    if (item.inputType === 'group') return renderGroupInput(item, val);
    return `<textarea data-edit class="soft-textarea mt-2" rows="3" placeholder="Nhập nội dung..." oninput="setValue('${esc(item.itemId)}', this.value)">${esc(val.value || '')}</textarea>`;
}
function renderGroupInput(item, val) {
    const v = val.value || {};
    return `<div class="mt-2">${(item.fields || []).map(f => {
        if (f.type === 'timerange') {
            const fv = v[f.key] || {};
            return `<div class="row g-2 mt-1"><div class="col-12 mini-label">${esc(f.label)}</div>
                <div class="col-6"><input data-edit class="soft-input" type="time" value="${esc(fv.on || '')}" onchange="setGroupRange('${esc(item.itemId)}','${esc(f.key)}','on',this.value)"></div>
                <div class="col-6"><input data-edit class="soft-input" type="time" value="${esc(fv.off || '')}" onchange="setGroupRange('${esc(item.itemId)}','${esc(f.key)}','off',this.value)"></div>
            </div>`;
        }
        if (f.type === 'time') return `<label class="mini-label mt-2">${esc(f.label)}</label><input data-edit class="soft-input" type="time" value="${esc(v[f.key] || '')}" onchange="setGroup('${esc(item.itemId)}','${esc(f.key)}',this.value)">`;
        if (f.type === 'number') {
            const bad = violates(f.threshold, v[f.key]);
            const prev = getPrevItemValue(item.itemId, f.key);
            const isCm = f.unit === 'cm';

            let fieldHtml = '';
            if (isCm) {
                fieldHtml = `<div class="stepper-row">
                    <button data-edit type="button" class="stepper-btn" onclick="stepCmValue('${esc(item.itemId)}', -1, '${esc(f.key)}')">-</button>
                    <input data-edit class="soft-input ${bad ? 'bad' : ''} text-center fw-bold" type="number" step="any" inputmode="decimal" value="${esc(v[f.key] || '')}" oninput="setGroup('${esc(item.itemId)}','${esc(f.key)}',this.value)">
                    <button data-edit type="button" class="stepper-btn" onclick="stepCmValue('${esc(item.itemId)}', 1, '${esc(f.key)}')">+</button>
                    <span class="unit">${esc(f.unit || '')}</span>
                </div>`;
            } else {
                fieldHtml = `<div class="field-row">
                    <input data-edit class="soft-input ${bad ? 'bad' : ''}" type="number" step="any" inputmode="decimal" value="${esc(v[f.key] || '')}" oninput="setGroup('${esc(item.itemId)}','${esc(f.key)}',this.value)">
                    <span class="unit">${esc(f.unit || '')}</span>
                </div>`;
            }

            const prevBtn = (prev && (v[f.key] === '' || v[f.key] == null)) ?
                `<button data-edit type="button" class="btn-prev-chip" onclick="applyPrevValue('${esc(item.itemId)}', '${esc(f.key)}')"><i class="bi bi-clock-history me-1"></i>Lấy số ca trước (${esc(prev.value)} ${esc(f.unit || '')})</button>` : '';

            return `<label class="mini-label mt-2">${esc(f.label)}</label>${fieldHtml}${prevBtn}${bad ? `<div class="warn-text">Ngoài ngưỡng ${esc(f.threshold)}</div>` : ''}`;
        }
        return `<label class="mini-label mt-2">${esc(f.label)}</label><input data-edit class="soft-input" value="${esc(v[f.key] || '')}" oninput="setGroup('${esc(item.itemId)}','${esc(f.key)}',this.value)">`;
    }).join('')}</div>`;
}

function changed(itemId, rerender = false) {
    if (isLocked()) return;
    currentRun.dirty = true;
    saveLocalDraft(currentRun);
    setSyncState('pending');
    if (rerender) renderRun(); else updateProgress();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => flushSave(false), 1800);
}
function setCheck(itemId, status) {
    const v = itemVal(itemId);
    v.status = v.status === status ? '' : status;
    changed(itemId, true);
}
function setValue(itemId, value) { itemVal(itemId).value = value; changed(itemId, false); }
function setRange(itemId, key, value) {
    const v = itemVal(itemId);
    if (!v.value || typeof v.value !== 'object') v.value = {};
    v.value[key] = value;
    changed(itemId, false);
}
function setGroup(itemId, key, value) {
    const v = itemVal(itemId);
    if (!v.value || typeof v.value !== 'object') v.value = {};
    v.value[key] = value;
    changed(itemId, false);
}
function setGroupRange(itemId, key, sub, value) {
    const v = itemVal(itemId);
    if (!v.value || typeof v.value !== 'object') v.value = {};
    if (!v.value[key] || typeof v.value[key] !== 'object') v.value[key] = {};
    v.value[key][sub] = value;
    changed(itemId, false);
}
function setNote(itemId, value) { itemVal(itemId).note = value; changed(itemId, false); }
function markAllOk() {
    if (isLocked()) return;
    templateItems(currentRun.templateId).filter(x => x.inputType === 'check').forEach(item => itemVal(item.itemId).status = 'ok');
    changed('', true);
    toast('Đã đánh Đạt các mục kiểm tra');
}
function updateProgress() {
    if (!currentRun) return;
    const total = templateItems(currentRun.templateId).length;
    const done = countDone(currentRun.templateId, currentRun.items);
    $('progressFill').style.width = total ? `${done / total * 100}%` : '0%';
    $('progressText').textContent = `${done}/${total} mục`;
    const pill = currentRun.status === 'confirmed' ? '<span class="pill green">Đã xác nhận</span>' :
        currentRun.status === 'submitted' ? '<span class="pill blue">Đã chốt</span>' :
        currentRun.dirty ? '<span class="pill amber">Có thay đổi</span>' : '<span class="pill gray">Nháp</span>';
    $('statusPill').outerHTML = `<span id="statusPill">${pill}</span>`;
}
function setSyncState(state) {
    $('syncPill').className = 'pill ' + (state === 'pending' ? 'amber' : 'green');
    $('syncPill').innerHTML = state === 'pending' ? '<i class="bi bi-cloud-arrow-up"></i>Chờ lưu' : '<i class="bi bi-cloud-check"></i>Đã lưu';
}
async function flushSave(showToast) {
    clearTimeout(saveTimer);
    if (!currentRun || !currentRun.dirty || isLocked()) return;
    const op = getOperator();
    try {
        const res = await bdsApiPost('saveGolfRun', { payload: {
            runId: currentRun.runId,
            date: currentRun.date,
            templateId: currentRun.templateId,
            operator: op,
            updatedBy: op,
            items: JSON.stringify(currentRun.items)
        }});
        if (res.status === 'success') {
            currentRun.dirty = false;
            saveLocalDraft(currentRun);
            setSyncState('ok');
            if (showToast) toast('Đã lưu nháp');
        } else if (showToast) toast(res.message || 'Chưa lưu được', 'danger');
    } catch (_) {
        setSyncState('pending');
        if (showToast) toast('Đã lưu trên máy, sẽ đồng bộ khi có mạng', 'warning');
    }
}

function renderSubmitArea() {
    if (currentRun.status === 'confirmed') {
        $('quickActions').style.display = 'none';
        $('submitArea').innerHTML = '<div class="panel"><span class="pill green"><i class="bi bi-patch-check"></i>Checklist đã hoàn tất và được xác nhận bàn giao.</span></div>';
    } else if (currentRun.status === 'submitted') {
        $('quickActions').style.display = 'none';
        $('submitArea').innerHTML = '<div class="panel"><span class="pill blue"><i class="bi bi-send-check"></i>Đã chốt ca, chờ ca sau xác nhận nhận bàn giao.</span></div>';
    } else {
        $('quickActions').style.display = '';
        $('submitArea').innerHTML = '<button class="primary-btn w-100 mt-2" onclick="openSubmitModal()"><i class="bi bi-send-check-fill"></i>Chốt ca & bàn giao</button>';
    }
}
function onConfirmIncompleteChange() {
    const chk = $('confirmIncompleteCheck');
    const btn = $('btnConfirmSubmit');
    if (btn) btn.disabled = !(chk && chk.checked);
}

function openSubmitModal() {
    const op = getOperator();
    if (!op) return toast('Nhập người thực hiện trước khi chốt ca', 'warning');
    const items = templateItems(currentRun.templateId);
    const total = items.length;
    const done = countDone(currentRun.templateId, currentRun.items);
    const warnings = items.filter(it => hasViolation(it, currentRun.items[it.itemId]));
    const incomplete = items.filter(it => !itemIsDone(it, currentRun.items[it.itemId]));

    let summaryHtml = `<div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold">Tiến độ ca:</span>
        <span class="pill ${done === total ? 'green' : 'amber'}">${done}/${total} mục đã xong</span>
    </div>`;

    if (warnings.length > 0) {
        summaryHtml += `<div class="alert alert-warning py-2 px-3 mb-2 small">
            <div class="fw-bold"><i class="bi bi-exclamation-triangle-fill me-1"></i>Có ${warnings.length} mục báo Lỗi / ngoài ngưỡng:</div>
            <ul class="mb-0 ps-3 mt-1">${warnings.map(it => `<li>${esc(it.label)}</li>`).join('')}</ul>
        </div>`;
    }

    if (incomplete.length > 0) {
        summaryHtml += `<div class="alert alert-danger py-2 px-3 mb-2 small">
            <div class="fw-bold"><i class="bi bi-x-circle-fill me-1"></i>Còn ${incomplete.length} mục chưa hoàn thành:</div>
            <ul class="mb-0 ps-3 mt-1">${incomplete.map(it => `<li>${esc(it.label)}</li>`).join('')}</ul>
        </div>
        <div class="form-check mt-3 bg-light p-2 rounded border">
            <input class="form-check-input ms-1 me-2" type="checkbox" id="confirmIncompleteCheck" onchange="onConfirmIncompleteChange()">
            <label class="form-check-label fw-bold text-danger small" for="confirmIncompleteCheck">Tôi xác nhận vẫn muốn chốt ca dù còn ${incomplete.length} mục chưa xong</label>
        </div>`;
    }

    $('submitSummary').innerHTML = summaryHtml;

    // Thống nhất 1 nguồn bàn giao: đọc từ mục text nếu có
    const textItem = items.find(it => it.inputType === 'text' && /bàn giao|phát sinh|ghi chú/i.test(it.label));
    if (textItem && currentRun.items[textItem.itemId]?.value && !$('handoverNoteInput').value) {
        $('handoverNoteInput').value = currentRun.items[textItem.itemId].value;
    }

    const btn = $('btnConfirmSubmit');
    if (incomplete.length > 0) {
        btn.disabled = true;
    } else {
        btn.disabled = false;
    }

    new bootstrap.Modal($('submitModal')).show();
}

async function doSubmitRun() {
    const btn = $('btnConfirmSubmit');
    btn.disabled = true;
    const op = getOperator();
    const handoverNoteVal = $('handoverNoteInput').value.trim();

    // Thống nhất 1 nguồn bàn giao: đồng bộ ngược lại vào mục text trong checklist
    const textItem = templateItems(currentRun.templateId).find(it => it.inputType === 'text' && /bàn giao|phát sinh|ghi chú/i.test(it.label));
    if (textItem && handoverNoteVal) {
        itemVal(textItem.itemId).value = handoverNoteVal;
    }

    try {
        await flushSave(false);
        const res = await bdsApiPost('submitGolfRun', { payload: {
            runId: currentRun.runId,
            date: currentRun.date,
            templateId: currentRun.templateId,
            operator: op,
            updatedBy: op,
            items: JSON.stringify(currentRun.items),
            handoverNote: handoverNoteVal,
            handoverTo: $('handoverToInput').value.trim()
        }});
        if (res.status === 'success') {
            currentRun.status = 'submitted';
            currentRun.dirty = false;
            saveLocalDraft(currentRun);
            bootstrap.Modal.getInstance($('submitModal'))?.hide();
            toast('Đã chốt ca');
            renderRun();
        } else {
            toast(res.message || 'Không chốt được', 'danger');
        }
    } catch (err) {
        toast('Lỗi chốt ca: ' + err.message, 'danger');
    } finally {
        btn.disabled = false;
    }
}

function onDateChange() { loadRuns(); }
function shiftDate(days) {
    const d = new Date(selectedDate() + 'T12:00:00');
    d.setDate(d.getDate() + days);
    $('datePicker').value = d.toLocaleDateString('sv-SE');
    loadRuns();
}
window.addEventListener('online', () => flushSave(false));
document.addEventListener('DOMContentLoaded', () => {
    $('datePicker').value = todayStr();
    $('operatorInput').value = getOperator();
    $('operatorInput').addEventListener('input', e => {
        if (window.BD_SSO) BD_SSO.setOperatorName(e.target.value.trim());
    });
    loadTemplates();
    loadRuns();
});
</script>
